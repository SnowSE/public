<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#1f2937">One service, one month: where the three numbers sit</text>

  <!-- regions -->
  <rect x="60" y="120" width="310" height="44" fill="#fde2e1"/>
  <rect x="370" y="120" width="248" height="44" fill="#fff4d6"/>
  <rect x="618" y="120" width="62" height="44" fill="#dcfce7"/>
  <rect x="60" y="120" width="620" height="44" fill="none" stroke="#6b7280"/>

  <text x="215" y="147" text-anchor="middle" font-size="13" fill="#991b1b">below the SLA: refunds / credits owed</text>
  <text x="494" y="140" text-anchor="middle" font-size="13" fill="#92400e">SLO missed, SLA still met:</text>
  <text x="494" y="156" text-anchor="middle" font-size="13" fill="#92400e">freeze features, fix reliability</text>
  <text x="649" y="140" text-anchor="middle" font-size="12" fill="#166534">error</text>
  <text x="649" y="155" text-anchor="middle" font-size="12" fill="#166534">budget</text>

  <!-- axis ticks -->
  <g font-size="12" fill="#374151" text-anchor="middle">
    <line x1="60" y1="164" x2="60" y2="172" stroke="#6b7280"/><text x="60" y="187">99.0%</text>
    <line x1="184" y1="164" x2="184" y2="172" stroke="#6b7280"/><text x="184" y="187">99.2%</text>
    <line x1="308" y1="164" x2="308" y2="172" stroke="#6b7280"/><text x="308" y="187">99.4%</text>
    <line x1="432" y1="164" x2="432" y2="172" stroke="#6b7280"/><text x="432" y="187">99.6%</text>
    <line x1="556" y1="164" x2="556" y2="172" stroke="#6b7280"/><text x="556" y="187">99.8%</text>
    <line x1="680" y1="164" x2="680" y2="172" stroke="#6b7280"/><text x="680" y="187">100%</text>
  </g>
  <text x="370" y="208" text-anchor="middle" font-size="12" fill="#6b7280">% of requests that succeeded this month</text>

  <!-- SLA marker -->
  <line x1="370" y1="100" x2="370" y2="172" stroke="#b91c1c" stroke-width="3"/>
  <text x="370" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#b91c1c">SLA 99.5%</text>
  <text x="370" y="76" text-anchor="middle" font-size="12" fill="#b91c1c">promise to customers</text>

  <!-- SLO marker -->
  <line x1="618" y1="100" x2="618" y2="172" stroke="#1d4ed8" stroke-width="3"/>
  <text x="560" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">SLO 99.9%</text>
  <text x="560" y="76" text-anchor="middle" font-size="12" fill="#1d4ed8">our own target</text>

  <!-- SLI measured -->
  <polygon points="649,232 641,246 657,246" fill="#111827"/>
  <line x1="649" y1="164" x2="649" y2="232" stroke="#111827" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="649" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">SLI this month: 99.95%</text>
  <text x="649" y="284" text-anchor="middle" font-size="12" fill="#374151">what we measured</text>

  <!-- margin brace -->
  <text x="494" y="232" text-anchor="middle" font-size="12" fill="#6b7280">gap between SLO and SLA =</text>
  <text x="494" y="248" text-anchor="middle" font-size="12" fill="#6b7280">warning room before money is on the line</text>
</svg>
