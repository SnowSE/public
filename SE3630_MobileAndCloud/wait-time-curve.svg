<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Wait time vs. utilization</title>
<desc id="d">Wait time equals percent busy divided by percent idle. 50% busy waits 1 unit, 75% waits 3, 90% waits 9, 95% waits 19, 99% waits 99. Flat until about 80%, then nearly vertical.</desc>
<style>
.bg{fill:#fcfcfb} .ink{fill:#0b0b0b} .ink2{fill:#52514e} .grid{stroke:#e4e3df;stroke-width:1} .axis{stroke:#8a8984;stroke-width:1}
.line{fill:none;stroke:#2a78d6;stroke-width:2.5;stroke-linejoin:round} .dot{fill:#2a78d6;stroke:#fcfcfb;stroke-width:2} .lead{stroke:#8a8984;stroke-width:1;stroke-dasharray:3 3}
@media (prefers-color-scheme: dark){ .bg{fill:#1a1a19} .ink{fill:#f0efec} .ink2{fill:#c3c2b7} .grid{stroke:#33332f} .axis{stroke:#6f6e69} .line{stroke:#3987e5} .dot{fill:#3987e5;stroke:#1a1a19} }
</style>
